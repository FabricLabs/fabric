# https://docs.codecov.com/docs/codecov-yaml
# Patch coverage should reflect instrumented JS; these paths are not exercised by the Mocha suite.
coverage:
  status:
    project:
      default:
        # Expanding the instrumented surface (new Peer/Service paths + tests that
        # load previously-unseen types) can lower project % even while patch stays
        # high. Allow a small regression while still failing large drops.
        target: auto
        threshold: 2%
    patch:
      default:
        target: auto
        threshold: 1%
  ignore:
    - contracts/**/*
    - examples/**/*
    - native/**/*
    - scripts/fix-noble-hashes-compat.js
    - scripts/benchmark-report.js
    # Optional undeclared deps — packaging pins them as known-unloadable.
    - services/turntable.js
    - services/exchange.js
    - services/mqtt.js
